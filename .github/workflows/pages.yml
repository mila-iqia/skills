name: Publish skills site

# Builds a static site with the skills of every plugin listed in
# .claude-plugin/marketplace.json (external plugins are fetched at build time)
# plus a generated index.json per plugin, and publishes it to GitHub Pages so
# OpenCode can load e.g.
#   https://mila-iqia.github.io/skills/opt-tools/skills
#   https://mila-iqia.github.io/skills/pytorch-opt-skills/skills

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # weekly, to pick up changes in external plugins
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site
        run: python .github/scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
